server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API lives in the backend container; the browser only talks to this origin.
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /js/ { expires 7d; add_header Cache-Control "public, immutable"; }
    location /css/ { expires 7d; add_header Cache-Control "public, immutable"; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
